appId: app.tydeoutside.desktop
productName: tyde
directories:
  output: ../../release
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: ../web/dist
    to: web
  - from: resources/runtime.json
    to: runtime.json
  - from: resources
    to: .
    filter:
      - icon.png
      - icon.ico
asar: true
npmRebuild: false
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
mac:
  target: dmg
  icon: resources/icon.icns
  category: public.app-category.productivity
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: '12.0'
win:
  target: nsis
  icon: resources/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish: null
